name: Generate Dynamic XML Sitemap

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *' # Har raat auto-update hoga

jobs:
  sitemap_job:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout the repo
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Generate Sitemap from Firebase
      run: node generate-sitemap.js

    - name: Commit and push if changed
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add sitemap.xml
        if [ -n "$(git status --porcelain sitemap.xml)" ]; then
          git commit -m "Auto-update dynamic sitemap.xml with Firebase URLs"
          git push
        fi
