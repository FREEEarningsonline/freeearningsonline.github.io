<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Typing Master Pro</title>
<meta name="description" content="Professional browser-based typing tutor with lessons, tests, keyboard and finger guidance.">
<style>
:root {
  --bg: #f5f7fb; --panel: #fff; --text: #172033; --muted: #687386; --primary: #2563eb;
  --primary2: #1d4ed8; --success: #16a34a; --danger: #dc2626; --border: #e3e8f0;
  --key: #eef2f7; --key2: #dce4ef; --shadow: 0 12px 35px rgba(25,45,80,.09);
  --error-bg: #fee2e2; --focus-ring: #dbe7ff;
}

*, *::before, *::after {
  box-sizing: border-box;
  transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
}

html, body {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  margin: 0;
  padding: 0;
}

body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; outline: none; }
button { cursor: pointer; }

.app { max-width: 1250px; width: 100%; margin: auto; padding: 20px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; width: 100%; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 46px; height: 46px; border-radius: 13px; background: var(--primary); color: #fff; display: grid; place-items: center; font-weight: 900; font-size: 22px; box-shadow: 0 8px 20px rgba(37,99,235,.25); }
h1 { font-size: 24px; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
.top-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 10px 16px; border-radius: 10px; font-weight: 700; min-height: 44px; display: flex; align-items: center; justify-content: center; }
.btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn.primary:hover { background: var(--primary2); }

.tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 5px; -webkit-overflow-scrolling: touch; scrollbar-width: none; width: 100%; }
.tabs::-webkit-scrollbar { display: none; }
.tab { border: 0; background: transparent; padding: 10px 15px; border-radius: 9px; color: var(--muted); font-weight: 800; white-space: nowrap; min-height: 44px; flex-shrink: 0; }
.tab.active { background: #e8efff; color: var(--primary); }

.grid { display: grid; grid-template-columns: 1fr 330px; gap: 18px; align-items: start; width: 100%; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); width: 100%; overflow: hidden; }
.card.pad { padding: 18px; }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; width: 100%; }
.stat { padding: 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg); text-align: center; }
.stat b { display: block; font-size: 25px; }
.stat span { color: var(--muted); font-size: 12px; }

.progress { height: 7px; background: var(--border); border-radius: 20px; overflow: hidden; margin: 10px 0 18px; width: 100%; }
.progress i { display: block; height: 100%; width: 0; background: var(--primary); transition: width 0.2s ease; }

.textbox { min-height: 180px; padding: 20px; font-size: 22px; line-height: 1.8; letter-spacing: 0.5px; border: 1px solid var(--border); border-radius: 13px; background: var(--bg); margin-bottom: 12px; user-select: none; position: relative; overflow-y: auto; max-height: 300px; cursor: text; word-break: break-word; width: 100%; }
.char { color: var(--muted); opacity: 0.6; }
.char.done { color: var(--success); opacity: 1; }
.char.error { color: var(--danger); background: var(--error-bg); border-radius: 3px; opacity: 1; }
.char.current { border-bottom: 3px solid var(--primary); color: var(--text); opacity: 1; }

textarea.input { width: 100%; min-height: 120px; resize: vertical; border: 1px solid var(--border); border-radius: 11px; padding: 12px; background: var(--panel); color: var(--text); }
textarea.input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--focus-ring); }
.hidden-input { position: absolute; opacity: 0; width: 1px; height: 1px; top: 0; left: 0; z-index: -1; pointer-events: none; }

.controls { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; width: 100%; }
.select { border: 1px solid var(--border); padding: 0 12px; border-radius: 9px; background: var(--panel); color: var(--text); min-height: 44px; }

.keyboard { padding: 14px; width: 100%; }
.krow { display: flex; gap: 6px; margin: 6px 0; justify-content: center; width: 100%; }
.key { height: 45px; min-width: 45px; padding: 0 8px; border: 1px solid var(--border); border-radius: 7px; background: var(--key); display: grid; place-items: center; font-weight: 800; font-size: 12px; box-shadow: 0 2px 0 var(--border); transition: 0.1s; }
.key.wide { min-width: 75px; } .key.xwide { min-width: 110px; } .key.space { min-width: 280px; }
.key.active { background: #bfdbfe; border-color: var(--primary); transform: translateY(2px); box-shadow: 0 0 0 var(--border); color: #172033; }

.finger-guide { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.finger { padding: 12px; border-radius: 11px; background: var(--bg); border: 1px solid var(--border); text-align: center; }
.finger b { display: block; margin-bottom: 4px; font-size: 14px; }
.finger small { color: var(--muted); font-size: 11px; }

.side-title { font-weight: 900; margin-bottom: 12px; }
.list { display: grid; gap: 8px; width: 100%; }
.lesson { padding: 12px; border: 1px solid var(--border); border-radius: 11px; background: var(--panel); text-align: left; color: var(--text); width: 100%; }
.lesson:hover { border-color: var(--primary); }
.lesson b { display: block; } .lesson small { color: var(--muted); }

.result { text-align: center; padding: 30px; }
.result .big { font-size: 56px; font-weight: 950; color: var(--primary); line-height: 1.1; }
.badge { display: inline-block; padding: 5px 10px; border-radius: 999px; background: var(--primary); color: #fff; font-size: 12px; font-weight: 800; }
.notice { padding: 11px 13px; background: rgba(37, 99, 235, 0.1); border: 1px solid rgba(37, 99, 235, 0.2); border-radius: 10px; color: var(--text); font-size: 13px; width: 100%; }

.footer { text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }

@media(max-width: 1024px) {
  .grid { grid-template-columns: 1fr 280px; }
  .key { min-width: 38px; font-size: 11px; }
  .key.space { min-width: 200px; }
}

@media(max-width: 768px) {
  .app { padding: 10px; }
  header { margin-bottom: 12px; flex-direction: column; align-items: flex-start; gap: 10px; }
  .top-actions { width: 100%; justify-content: flex-start; }
  .grid { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .stat { padding: 10px; }
  .stat b { font-size: 20px; }
  .textbox { font-size: 18px; min-height: 130px; padding: 14px; }
  .mobile-hide { display: none !important; }
  .controls { flex-direction: column; align-items: stretch; }
  .controls .btn, .controls .select { width: 100%; }
  h1 { font-size: 20px; }
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">
    <div class="logo">⌨</div>
    <div><h1>Typing Master Pro</h1><div class="sub">Learn • Practice • Test • Improve</div></div>
  </div>
  <div class="top-actions">
    <button class="btn" id="soundBtn">🔊 Sound</button>
    <button class="btn" id="themeBtn">🌙 Theme</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-mode="practice">Practice</button>
  <button class="tab" data-mode="test">Typing Test</button>
  <button class="tab" data-mode="lessons">Lessons</button>
  <button class="tab" data-mode="custom">Custom Text</button>
</div>

<div id="main"></div>
<div class="footer">Typing Master Pro • Fully Optimized for PC, Tablet & Mobile</div>
</div>

<script>
const lessons=[
 {title:"Home Row Basics",level:"Beginner",text:"asdf jkl; asdf jkl; sad lad fall ask flask;"},
 {title:"Left & Right Hand",level:"Beginner",text:"a s d f j k l ; sad dad fad all ask lad;"},
 {title:"Top & Bottom Row",level:"Beginner",text:"qwer uiop zxcv nm,. quiet power zoom mix van;"},
 {title:"Numbers",level:"Intermediate",text:"123 456 7890 2026 1500 98765 42 100;"},
 {title:"Speed Builder",level:"Intermediate",text:"Practice makes progress. Accuracy comes before speed. Keep your hands relaxed."},
 {title:"Professional Text",level:"Advanced",text:"Typing is a practical digital skill. With consistent practice, correct placement, and careful attention to accuracy, your speed can improve naturally over time."}
];

let audioCtx = null;
let state = {
  mode: "practice", text: lessons[0].text, typedText: "", errors: 0, 
  start: null, elapsed: 0, timer: null, sound: true, dark: false, 
  finished: false, selectedLesson: 0
};
const main=document.getElementById("main");

function render(){
 if(state.mode==="lessons") return renderLessons();
 if(state.mode==="custom") return renderCustom();
 renderPractice();
}

function renderPractice(){
 main.innerHTML=`
 <div class="grid">
  <section>
   <div class="stats">
    <div class="stat"><b id="wpm">0</b><span>WPM</span></div>
    <div class="stat"><b id="acc">100%</b><span>Accuracy</span></div>
    <div class="stat"><b id="time">0s</b><span>Time</span></div>
    <div class="stat"><b id="errors">0</b><span>Errors</span></div>
   </div>
   <div class="card pad">
    <div class="badge">${state.mode==="test"?"Timed Typing Test":"Practice Mode"}</div>
    <div class="progress"><i id="bar"></i></div>
    <div id="textBox" class="textbox"></div>
    <input type="text" id="typingInput" class="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-gramm="false">
    
    <div class="controls">
      <button class="btn primary" id="startBtn">▶ Start Typing</button>
      <button class="btn" id="resetBtn">↻ Reset</button>
      ${state.mode==="test" ? `<select class="select" id="duration">
       <option value="5">5 sec test</option>
       <option value="30">30 sec test</option>
       <option value="60" selected>60 sec test</option>
       <option value="120">120 sec test</option>
      </select>` : ''}
    </div>
    <div class="notice" style="margin-top:12px">Tip: Tap box or "Start Typing" to focus keyboard.</div>
   </div>
   
   <div class="card keyboard mobile-hide" style="margin-top:18px">
    <div class="side-title">Virtual Keyboard</div>
    <div id="keyboard"></div>
   </div>
  </section>
  <aside>
   <div class="card pad">
    <div class="side-title">Current Lesson</div>
    <div class="lesson"><b>${lessons[state.selectedLesson].title}</b><small>${lessons[state.selectedLesson].level}</small></div>
    <button class="btn" id="nextLesson" style="width:100%;margin-top:10px">Next Lesson →</button>
   </div>
   <div class="card pad mobile-hide" style="margin-top:18px">
    <div class="side-title">Finger Guide</div>
    <div class="finger-guide">
      <div class="finger"><b>Left Pinky</b><small>Q A Z</small></div>
      <div class="finger"><b>Right Pinky</b><small>P ; /</small></div>
      <div class="finger"><b>Left Ring</b><small>W S X</small></div>
      <div class="finger"><b>Right Ring</b><small>O L .</small></div>
      <div class="finger"><b>Left Middle</b><small>E D C</small></div>
      <div class="finger"><b>Right Middle</b><small>I K ,</small></div>
      <div class="finger"><b>Left Index</b><small>R F V T G B</small></div>
      <div class="finger"><b>Right Index</b><small>Y H N U J M</small></div>
    </div>
   </div>
  </aside>
 </div>`;
 buildText(); buildKeyboard(); bindPractice();
}

function renderLessons(){
 main.innerHTML=`<div class="card pad"><h2>Typing Lessons</h2><p class="sub">Choose a lesson and build your skill step by step.</p><div class="list">${lessons.map((l,i)=>`<button class="lesson" data-lesson="${i}"><b>${i+1}. ${l.title}</b><small>${l.level} • ${l.text.length} characters</small></button>`).join("")}</div></div>`;
 document.querySelectorAll("[data-lesson]").forEach(b=>b.onclick=()=>{state.selectedLesson=+b.dataset.lesson;state.text=lessons[state.selectedLesson].text;reset();state.mode="practice";activateTab("practice");render();});
}

function renderCustom(){
 main.innerHTML=`<div class="card pad"><h2>Custom Practice</h2><p class="sub">Paste any paragraph, notes, or study material.</p>
 <textarea class="input" id="customText" placeholder="Paste your text here...">${state.text}</textarea>
 <button class="btn primary" id="useCustom" style="margin-top:10px; width:100%">Use This Text</button></div>`;
 document.getElementById("useCustom").onclick=()=>{const t=document.getElementById("customText").value.trim();if(!t)return alert("Please enter text.");state.text=t;reset();state.mode="practice";activateTab("practice");render();};
}

function buildText(){
 const box=document.getElementById("textBox");
 if(!box) return;
 const pos = state.typedText.length;
 box.innerHTML=[...state.text].map((c,i)=>{
   let cls = "char";
   if(i < pos) {
     cls += (state.typedText[i] === state.text[i]) ? " done" : " error";
   } else if(i === pos) {
     cls += " current";
   }
   return `<span class="${cls}">${c===" "?"&nbsp;":escapeHtml(c)}</span>`;
 }).join("");
}

function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));}

const rows=[["`","1","2","3","4","5","6","7","8","9","0","-","=","Backspace"],["Tab","Q","W","E","R","T","Y","U","I","O","P","[","]","\\"],["Caps","A","S","D","F","G","H","J","K","L",";","'","Enter"],["Shift","Z","X","C","V","B","N","M",",",".","/","Shift"],["Ctrl","Win","Alt","Space","Alt","Win","Menu","Ctrl"]];

function buildKeyboard(){
 const k=document.getElementById("keyboard");
 if(!k) return;
 k.innerHTML=rows.map((r,ri)=>`<div class="krow">${r.map(x=>{let cl="key";if(["Backspace","Tab","Caps","Enter"].includes(x))cl+=" wide";if(x==="Shift")cl+=" xwide";if(x==="Space")cl+=" space";return `<div class="${cl}" data-key="${x}">${x}</div>`}).join("")}</div>`).join("");
 updateKey();
}

function updateKey(){
 document.querySelectorAll(".key").forEach(k=>k.classList.remove("active"));
 const c=state.text[state.typedText.length];
 if(!c) return;
 
 let target = c === " " ? "Space" : c.toUpperCase();
 const symbolMap = {
   ':': ';', '"': "'", '<': ',', '>': '.', '?': '/',
   '{': '[', '}': ']', '|': '\\', '_': '-', '+': '=',
   '!': '1', '@': '2', '#': '3', '$': '4', '%': '5',
   '^': '6', '&': '7', '*': '8', '(': '9', ')': '0'
 };
 if(symbolMap[c]) target = symbolMap[c];

 const el=document.querySelector(`.key[data-key="${CSS.escape(target)}"]`);
 if(el) el.classList.add("active");
}

function bindPractice(){
 const input=document.getElementById("typingInput");
 const startBtn = document.getElementById("startBtn");
 const box = document.getElementById("textBox");
 
 const focusInput = () => {
   if(!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
   if(audioCtx.state === 'suspended') { audioCtx.resume(); }
   if(input) input.focus();
 };
 
 if(startBtn) startBtn.onclick = focusInput;
 if(box) box.onclick = focusInput;
 document.getElementById("resetBtn").onclick=()=>{reset(); render();};
 document.getElementById("nextLesson").onclick=()=>{state.selectedLesson=(state.selectedLesson+1)%lessons.length;state.text=lessons[state.selectedLesson].text;reset();render();};
 
 if(input) {
   input.value = ""; 
   input.oninput=handleInput;
 }
 
 if(state.mode==="test" && document.getElementById("duration")){
   document.getElementById("duration").onchange=()=>{reset(); render();};
 }
}

function handleInput(e){
 const input = e.target;
 let val = input.value;
 
 val = val.replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/\u00A0/g, " ");

 if (!state.start && val.length > 0) startTimer();

 // Strict Mobile Auto-Correct & Multiple-Character Insertion Fix
 if (val.length > state.typedText.length + 1) {
   val = state.typedText + val.slice(-1);
 }

 const newIndex = val.length - 1;
 if (val.length > state.typedText.length && newIndex < state.text.length) {
   const expected = state.text[newIndex];
   const actual = val[newIndex];
   
   if (actual !== expected) {
     state.errors++;
     if (state.sound) beep();
   }
 } else if (val.length < state.typedText.length) {
   // Backspace handling
   state.typedText = val;
   input.value = val;
   buildText();
   updateKey();
   updateStats();
   return;
 }

 state.typedText = val;
 input.value = val;

 buildText();
 updateKey();
 updateStats();

 if (state.typedText.length >= state.text.length) {
   finish();
 }
}

function startTimer(){
 state.start=Date.now();
 clearInterval(state.timer);
 state.timer=setInterval(updateStats, 250);
}

function updateStats(){
 if(!state.start)return;
 const sec=Math.max((Date.now()-state.start)/1000,.1);
 state.elapsed=sec;
 
 const totalTyped = state.typedText.length;
 const correct = Math.max(totalTyped - state.errors, 0);
 const wpm = Math.round((correct / 5) / (sec / 60));
 const acc = totalTyped ? Math.max(0, Math.round((correct / totalTyped) * 100)) : 100;
 
 const wpmEl = document.getElementById("wpm");
 if(wpmEl) wpmEl.textContent=wpm;
 const accEl = document.getElementById("acc");
 if(accEl) accEl.textContent=acc+"%";
 const timeEl = document.getElementById("time");
 if(timeEl) timeEl.textContent=Math.floor(sec)+"s";
 const errEl = document.getElementById("errors");
 if(errEl) errEl.textContent=state.errors;
 const barEl = document.getElementById("bar");
 if(barEl) barEl.style.width=Math.min(100, (totalTyped / state.text.length) * 100)+"%";
 
 if(state.mode==="test"){
   const limit=+(document.getElementById("duration")?.value||60);
   if(sec>=limit) finish();
 }
}

function finish(){
 clearInterval(state.timer);
 const sec=Math.max(state.elapsed,.1);
 const totalTyped = state.typedText.length;
 const correct = Math.max(totalTyped - state.errors, 0);
 const wpm = Math.round((correct / 5) / (sec / 60));
 const acc = totalTyped ? Math.round((correct / totalTyped) * 100) : 100;

 main.innerHTML=`<div class="card result"><div class="badge">COMPLETE</div><div class="big">${wpm} WPM</div><h2>${acc}% Accuracy</h2><p>You typed ${correct} correct characters with ${state.errors} errors in ${Math.floor(sec)} seconds.</p><button class="btn primary" id="again" style="margin: 15px auto">↻ Try Again</button></div>`;
 document.getElementById("again").onclick=()=>{reset();render();};
}

function reset(){
 clearInterval(state.timer); 
 state.typedText=""; 
 state.errors=0; 
 state.start=null; 
 state.elapsed=0;
 
 const input = document.getElementById("typingInput");
 if (input) { input.value = ""; }
}

function activateTab(mode){
 document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mode===mode));
 state.mode=mode;
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{activateTab(t.dataset.mode);reset();render();});

document.getElementById("soundBtn").onclick=()=>{
 state.sound=!state.sound; 
 document.getElementById("soundBtn").innerHTML=state.sound?"🔊 Sound":"🔇 Muted";
};

document.getElementById("themeBtn").onclick=()=>{
 state.dark=!state.dark;
 document.documentElement.style.setProperty("--bg",state.dark?"#0f172a":"#f5f7fb");
 document.documentElement.style.setProperty("--panel",state.dark?"#1e293b":"#fff");
 document.documentElement.style.setProperty("--text",state.dark?"#f8fafc":"#172033");
 document.documentElement.style.setProperty("--muted",state.dark?"#94a3b8":"#687386");
 document.documentElement.style.setProperty("--border",state.dark?"#334155":"#e3e8f0");
 document.documentElement.style.setProperty("--key",state.dark?"#334155":"#eef2f7");
 document.documentElement.style.setProperty("--error-bg",state.dark?"#7f1d1d":"#fee2e2");
 document.documentElement.style.setProperty("--focus-ring",state.dark?"#1e3a8a":"#dbe7ff");
};

function beep(){
 try{
    if(!audioCtx) return;
    if(audioCtx.state === 'suspended') { audioCtx.resume(); }
    const o=audioCtx.createOscillator(),g=audioCtx.createGain();
    o.frequency.value= 200; 
    o.type = "triangle";
    g.gain.value=.05;
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+.08);
 }catch(e){}
}

render();
</script>
</body>
</html>
